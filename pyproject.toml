[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "env-builder"
version = "0.1.0"
description = "手元PCから踏み台越しにSSH接続し、参照元(src)を参考に構築先(dst)の環境を整えてbuildを通すための作業基盤"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "paramiko>=3.4",
]

[project.optional-dependencies]
# 開発・テスト・CI 用のパッケージ（CI の .[dev] インストール対象）
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.0.0",
]

[tool.setuptools]
# scripts/ をパッケージとして自動探索させない（このプロジェクトは実行スクリプト集）。
# editable install（CI の -e ".[dev]"）を成立させつつ、パッケージ探索の失敗を避ける。
packages = []

[tool.uv]
package = false

# ==========================================
# Linter & Formatter (Ruff)
# ==========================================
[tool.ruff]
line-length = 120
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    "build_env",
]

[tool.ruff.lint]
# E: pycodestyle errors, F: Pyflakes, W: pycodestyle warnings, I: isort
select = ["E", "F", "W", "I"]
ignore = []

# ==========================================
# Type Checker (Mypy)
# ==========================================
[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
warn_redundant_casts = true
show_error_codes = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
# サードパーティ製ライブラリの型定義が見つからない際のエラーを抑制
ignore_missing_imports = true
exclude = [
    "build/",
    "venv/",
    "\\.venv/",
    "build_env/",
]

# ==========================================
# Testing (Pytest)
# ==========================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v --tb=short"
