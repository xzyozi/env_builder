name: CI

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run Ruff (Linter)
        run: |
          uv run ruff check .

      - name: Run Ruff (Formatter Check)
        run: |
          uv run ruff format --check .

      - name: Run Mypy (Type Check)
        run: |
          if find . -type f \( -name '*.py' -o -name '*.pyi' \) -print -quit | grep -q .; then
            uv run mypy .
          else
            echo "No Python source or stub files found; skipping Mypy."
          fi

      - name: Run Pytest
        run: |
          if find . -type f -name 'test_*.py' -print -quit | grep -q .; then
            uv run pytest
          else
            echo "No test files found; skipping Pytest."
          fi
